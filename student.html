<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student - JB Bus Service</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>


<body>

    <h1>Student Bus Tracking</h1>

    <p>Tap the map to request a bus stop.</p>

    <div id="map"></div>


    <script type="module">

        // ---------------- FIREBASE IMPORTS ----------------

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


        import {
            getDatabase,
            ref,
            set,
            onValue
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


        // ---------------- FIREBASE CONFIG ----------------

        const firebaseConfig = {

            apiKey:
                "AIzaSyDLb1F3P0LX4atIF7MTQgF1nECX4rSqtV0",

            authDomain:
                "bus-tracker-5090b.firebaseapp.com",

            databaseURL:
                "https://bus-tracker-5090b-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId:
                "bus-tracker-5090b",

            storageBucket:
                "bus-tracker-5090b.firebasestorage.app",

            messagingSenderId:
                "745348645444",

            appId:
                "1:745348645444:web:59a33a22d823496e513211"
        };


        // ---------------- INITIALIZE FIREBASE ----------------

        const app =
            initializeApp(firebaseConfig);

        const database =
            getDatabase(app);


        // ---------------- MAP ----------------

        const map = L.map("map").setView(
            [17.493974, 78.315988],
            13
        );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,

                attribution:
                    "© OpenStreetMap contributors"
            }
        ).addTo(map);


        // ---------------- LIVE BUS LOCATION ----------------

        const busLocationRef = ref(
            database,
            "busLocation"
        );


        let busMarker = null;


        // Custom bus emoji icon

        const busIcon = L.divIcon({

            className: "bus-icon",

            html: `
                <div style="
                    font-size: 50px;
                    line-height: 50px;
                    text-align: center;
                ">
                    🚌
                </div>
            `,

            iconSize: [60, 60],

            iconAnchor: [30, 30],

            popupAnchor: [0, -30]
        });


        // Listen for driver's live location

        onValue(
            busLocationRef,

            function(snapshot) {

                // No bus location yet

                if (!snapshot.exists()) {
                    return;
                }


                const location =
                    snapshot.val();


                const latitude =
                    location.latitude;

                const longitude =
                    location.longitude;


                // Create bus marker first time

                if (busMarker === null) {

                    busMarker = L.marker(
                        [
                            latitude,
                            longitude
                        ],
                        {
                            icon: busIcon,

                            zIndexOffset: 1000
                        }
                    )
                    .addTo(map)
                    .bindPopup(
                        "<b>🚌 JB Bus</b>"
                    );

                }


                // Move existing bus marker

                else {

                    busMarker.setLatLng(
                        [
                            latitude,
                            longitude
                        ]
                    );

                }

            }
        );


        // ---------------- STUDENT CURRENT LOCATION ----------------

        navigator.geolocation.getCurrentPosition(

            function(position) {

                const latitude =
                    position.coords.latitude;

                const longitude =
                    position.coords.longitude;


                const userMarker = L.marker(
                    [
                        latitude,
                        longitude
                    ]
                )
                .addTo(map)
                .bindPopup(
                    "<b>Your Location</b>"
                );


                userMarker.openPopup();


                map.setView(
                    [
                        latitude,
                        longitude
                    ],
                    16
                );

            },


            function(error) {

                console.error(
                    "Error getting location:",
                    error
                );

            },


            {
                enableHighAccuracy: false,

                timeout: 30000,

                maximumAge: 60000
            }

        );


        // ---------------- STOP REQUESTS ----------------

        const requestsRef = ref(
            database,
            "stopRequests"
        );


        // ---------------- DEVICE ID ----------------

        let deviceId = localStorage.getItem(
            "busTrackerDeviceId"
        );


        // Create a unique ID for this device

        if (!deviceId) {

            deviceId = crypto.randomUUID();

            localStorage.setItem(
                "busTrackerDeviceId",
                deviceId
            );

        }


        // This device can only have one request

        const myRequestRef = ref(
            database,
            "stopRequests/" + deviceId
        );


        // ---------------- REQUEST A STOP ----------------

        map.on(
            "click",

            function(event) {

                const latitude =
                    event.latlng.lat;

                const longitude =
                    event.latlng.lng;


                const confirmed = confirm(
                    "Request bus stop at this location?"
                );


                if (!confirmed) {
                    return;
                }


                // set() replaces the old request
                // from this same device

                set(
                    myRequestRef,

                    {
                        latitude: latitude,

                        longitude: longitude,

                        timestamp: Date.now()
                    }
                )

                .then(function() {

                    alert(
                        "Bus stop saved successfully!"
                    );

                })

                .catch(function(error) {

                    console.error(
                        "Error saving request:",
                        error
                    );

                });

            }

        );


        // ---------------- SHOW STOP REQUESTS ----------------

        onValue(
            requestsRef,

            function(snapshot) {


                // Remove old request markers

                map.eachLayer(
                    function(layer) {

                        if (
                            layer.isStopRequestMarker
                        ) {

                            map.removeLayer(layer);

                        }

                    }
                );


                // No requests

                if (!snapshot.exists()) {
                    return;
                }


                // Draw all active requests

                snapshot.forEach(
                    function(childSnapshot) {

                        const request =
                            childSnapshot.val();


                        const marker = L.marker(
                            [
                                request.latitude,
                                request.longitude
                            ]
                        )
                        .addTo(map);


                        // Identify as stop marker

                        marker.isStopRequestMarker =
                            true;


                        marker.bindPopup(
                            "<b>Bus stop requested here</b><br>" +
                            "Waiting for bus..."
                        );

                    }
                );

            }

        );

    </script>

</body>

</html>
